name: shimbox_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+19

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  health: ^13.1.4

  # ▶ WebSocket
  web_socket_channel: ^2.4.4         # ← 오타(2.4.04) 수정
  connectivity_plus: ^6.0.5

  # db
  sqflite: ^2.3.0
  path: ^1.8.0

  cupertino_icons: ^1.0.8
  get: ^4.6.5
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  vector_graphics: ^1.1.9

  # 추가
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.3.0         # ← 본 deps에만 유지

  # Google Fit
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  google_sign_in: ^6.1.0
  http: ^1.4.0

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  firebase_analytics: ^11.5.0
  firebase_storage: ^12.4.7

  # Map / 위치
  flutter_naver_map: ^1.1.0
  geocoding: ^4.0.0
  location: ^8.0.0
  android_intent_plus: ^5.3.0
  url_launcher: ^6.2.5
  image_picker: ^1.1.2

  webview_flutter: ^4.2.2
  geolocator: ^14.0.1
  webview_flutter_android: ^4.7.0

  google_maps_flutter: ^2.6.0
  flutter_compass: ^0.8.1

  flutter_inappwebview: ^6.0.0

  firebase_app_check: ^0.3.2+7
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # shared_preferences: ^2.2.0     # ← (중복) 제거

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/signup/
    - assets/images/icons/
    - assets/images/health/
    - assets/images/wearable/
    - assets/images/home/
    - assets/images/delivery/
    - assets/images/map/
    - assets/map.html
    - assets/daum_postcode.html
    - assets/images/map/pin_red.svg
    - assets/images/map/pin_blue.svg

# ▶ 충돌 해결: location(>=8.0.0)은 web ^1.1.0 필요 / web_socket_channel(2.4.x)은 web ^0.5.0 필요
#   → 강제로 web 1.1.0 사용
dependency_overrides:
  web: ^1.1.0

  # To add assets to your application, add an assets section, like this:
  # assets:
