<!-- assets/images/icons/warning.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <title>warning-rounded</title>
  <!-- 삼각형: currentColor로 칠하고, stroke 라운드 조인으로 모서리 둥글게 -->
  <path
    d="M20 6 L34 34 L6 34 Z"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- 느낌표 막대(둥근 모서리) -->
  <rect x="18.6" y="14" width="2.8" height="13.2" rx="1.4" fill="#FFFFFF"/>
  <!-- 느낌표 점(둥근 원) -->
  <circle cx="20" cy="30.7" r="1.9" fill="#FFFFFF"/>
</svg>
